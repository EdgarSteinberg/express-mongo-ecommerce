tags:
  - name: Carts
    description: Gestión de carritos de compra

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CartProduct:
      type: object
      properties:
        product:
          type: string
          example: "65f4a7c8e123456789abc111"
        quantity:
          type: number
          example: 2

    Cart:
      type: object
      properties:
        _id:
          type: string
          example: "65f9c3a7b123456789abc999"
        products:
          type: array
          items:
            $ref: '#/components/schemas/CartProduct'

paths:

  /api/carts:
    get:
      tags:
        - Carts
      summary: Obtener todos los carritos
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de carritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'
        500:
          description: Error interno del servidor

    post:
      tags:
        - Carts
      summary: Crear un nuevo carrito
      security:
        - bearerAuth: []
      responses:
        201:
          description: Carrito creado correctamente
        500:
          description: Error interno del servidor

  /api/carts/{cid}:
    get:
      tags:
        - Carts
      summary: Obtener carrito por ID
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Carrito encontrado
        404:
          description: Carrito no encontrado
        500:
          description: Error interno

    put:
      tags:
        - Carts
      summary: Actualizar carrito completo
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                products:
                  - product: "65f4a7c8e123456789abc111"
                    quantity: 3
      responses:
        200:
          description: Carrito actualizado
        500:
          description: Error interno

    delete:
      tags:
        - Carts
      summary: Eliminar carrito
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Carrito eliminado correctamente
        500:
          description: Error interno

  /api/carts/{cid}/product/{pid}:
    post:
      tags:
        - Carts
      summary: Agregar producto al carrito
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: number
                  example: 2
      responses:
        201:
          description: Producto agregado al carrito
        500:
          description: Error interno

    put:
      tags:
        - Carts
      summary: Actualizar cantidad de un producto en el carrito
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: number
                  example: 5
      responses:
        200:
          description: Cantidad actualizada correctamente
        400:
          description: Debe enviar quantity en el body
        500:
          description: Error interno

    delete:
      tags:
        - Carts
      summary: Remover producto del carrito
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Producto removido correctamente
        500:
          description: Error interno