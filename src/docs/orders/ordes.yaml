openapi: 3.0.1
info:
  title: Orders API
  description: Documentación del módulo de órdenes
  version: 1.0.0

paths:

  /api/orders:
    get:
      summary: Obtener todas las órdenes (solo admin)
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        403:
          description: No autorizado

    post:
      summary: Crear nueva orden
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cartId:
                  type: string
                  example: 65fa23ab1290aa1234567890
                totalAmount:
                  type: number
                  example: 25000
                paymentMethod:
                  type: string
                  example: tarjeta
              required:
                - cartId
                - totalAmount
      responses:
        201:
          description: Orden creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        400:
          description: Error en los datos enviados

  /api/orders/my-orders:
    get:
      summary: Obtener órdenes del usuario autenticado
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        200:
          description: Órdenes del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

  /api/orders/{oid}:
    get:
      summary: Obtener orden por ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
          description: ID de la orden
      responses:
        200:
          description: Orden encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        404:
          description: Orden no encontrada

    put:
      summary: Actualizar orden
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, paid, cancelled]
                  example: paid
      responses:
        200:
          description: Orden actualizada
        400:
          description: Error en actualización

    delete:
      summary: Eliminar orden (solo admin)
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
      responses:
        200:
          description: Orden eliminada
        404:
          description: Orden no encontrada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Order:
      type: object
      properties:
        _id:
          type: string
          example: 65fa23ab1290aa1234567890
        user:
          type: string
          example: 65fa11cd1290aa9876543210
        products:
          type: array
          items:
            type: object
            properties:
              product:
                type: string
                example: 65fa55ef1290aa1122334455
              quantity:
                type: number
                example: 2
        totalAmount:
          type: number
          example: 25000
        status:
          type: string
          enum: [pending, paid, cancelled]
          example: pending
        createdAt:
          type: string
          format: date-time