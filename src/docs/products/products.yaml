tags:
  - name: Products
    description: Gestión de productos del sistema

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Product:
      type: object
      properties:
        _id:
          type: string
          example: "65f4a7c8e123456789abc111"
        title:
          type: string
          example: "iPhone 15"
        description:
          type: string
          example: "Última generación"
        price:
          type: number
          example: 1200
        stock:
          type: number
          example: 10
        category:
          type: string
          example: "smartphones"
        owner:
          type: string
          example: "admin"
        tags:
          type: array
          items:
            type: string
          example: ["apple", "mobile"]
        mainImage:
          type: string
          example: "iphone15.jpg"

paths:

  /api/products:
    get:
      tags:
        - Products
      summary: Obtener todos los productos
      responses:
        200:
          description: Lista completa de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        500:
          description: Error interno del servidor

    post:
      tags:
        - Products
      summary: Crear nuevo producto (admin o premium)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - price
                - stock
                - category
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: number
                category:
                  type: string
                tags:
                  type: string
                  description: Array en formato JSON string
                mainImage:
                  type: string
                  format: binary
      responses:
        201:
          description: Producto creado correctamente
        403:
          description: No autorizado
        500:
          description: Error interno

  /api/products/categories:
    get:
      tags:
        - Products
      summary: Obtener todas las categorías o productos filtrados por categoría
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Si se envía, devuelve productos de esa categoría
      responses:
        200:
          description: Lista de categorías o productos filtrados
        500:
          description: Error interno del servidor

  /api/products/{pid}:
    get:
      tags:
        - Products
      summary: Obtener producto por ID
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Producto encontrado
        404:
          description: Producto no encontrado
        500:
          description: Error interno

    put:
      tags:
        - Products
      summary: Actualizar producto (admin o premium)
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: number
                category:
                  type: string
                tags:
                  type: string
                  description: Array en formato JSON string
                mainImage:
                  type: string
                  format: binary
      responses:
        200:
          description: Producto actualizado correctamente
        403:
          description: No autorizado
        500:
          description: Error interno

    delete:
      tags:
        - Products
      summary: Eliminar producto (admin o owner premium)
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Producto eliminado correctamente
        403:
          description: No autorizado
        404:
          description: Producto no encontrado
        500:
          description: Error interno